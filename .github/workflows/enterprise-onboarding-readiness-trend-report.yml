name: Enterprise Onboarding Readiness Trend Report

on:
  workflow_dispatch:
    inputs:
      max_reports:
        description: "Maximum onboarding readiness artifacts to include in the trend"
        required: false
        default: "12"
        type: string
  schedule:
    - cron: "17 14 * * 4"

permissions:
  actions: read
  contents: read

env:
  GITGOV_ENV: ci

jobs:
  generate-trend:
    name: Generate enterprise onboarding readiness trend report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assert explicit runtime env
        run: bash "$GITHUB_WORKSPACE/.github/scripts/assert-gitgov-env.sh"

      - name: Generate trend report
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_MAX_REPORTS: ${{ inputs.max_reports }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          $maxReports = $env:INPUT_MAX_REPORTS
          if ([string]::IsNullOrWhiteSpace($maxReports)) {
            $maxReports = "12"
          }

          .\scripts\control-plane\generate_enterprise_onboarding_readiness_trend_report.ps1 `
            -Repository $env:GITHUB_REPOSITORY_NAME `
            -WorkflowFile "enterprise-onboarding-readiness.yml" `
            -ArtifactNamePrefix "enterprise-onboarding-readiness-" `
            -MaxReports ([int]$maxReports) `
            -OutputMarkdownPath "out/enterprise-onboarding-readiness-trend-report.md" `
            -OutputJsonPath "out/enterprise-onboarding-readiness-trend-report.json"

      - name: Upload trend report
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-onboarding-readiness-trend-report
          path: |
            out/enterprise-onboarding-readiness-trend-report.md
            out/enterprise-onboarding-readiness-trend-report.json
          if-no-files-found: error
