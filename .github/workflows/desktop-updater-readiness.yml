name: Desktop Updater Readiness (Optional)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe_endpoint:
        description: "Probe latest.json endpoint (may warn/fail if release artifact not published yet)"
        required: false
        default: false
        type: boolean
      fail_on_warnings:
        description: "Treat warnings as failure"
        required: false
        default: false
        type: boolean

jobs:
  updater-readiness:
    name: Validate desktop updater readiness
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run updater readiness validator
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
          PROBE_ENDPOINT: ${{ github.event.inputs.probe_endpoint || '' }}
          FAIL_ON_WARNINGS: ${{ github.event.inputs.fail_on_warnings || '' }}
        run: |
          $outputPath = "docs/reports/desktop-updater-readiness-$env:RUN_ID.md"
          $probe = $env:PROBE_ENDPOINT
          $failOnWarnings = $env:FAIL_ON_WARNINGS

          $readinessArgs = @{
            TauriConfigPath = "gitgov/src-tauri/tauri.conf.json"
            OutputPath = $outputPath
          }

          if ($probe -ne "true") {
            $readinessArgs.SkipEndpointProbe = $true
          }
          if ($failOnWarnings -eq "true") {
            $readinessArgs.FailOnWarnings = $true
          }

          & ./scripts/deploy/validate_desktop_updater_readiness.ps1 @readinessArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload updater readiness report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-updater-readiness-${{ github.run_id }}
          path: docs/reports/desktop-updater-readiness-${{ github.run_id }}.md
          if-no-files-found: warn
          retention-days: 30
