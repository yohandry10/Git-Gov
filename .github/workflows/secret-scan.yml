name: Secret Scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-guard:
    name: Security Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce publication policy (restricted files)
        shell: bash
        run: |
          set -euo pipefail
          restricted_re='^docs/ENTERPRISE_READINESS_DECISION\.md$|^docs/AUDIT_.*\.md$|^docs/INTEGRATIONS_AUDIT_.*\.md$|^\.claude/|^CLAUDE\.md$|^\.kiro/|^\.trae/|^\.windsurf/'
          violations="$(git ls-files | grep -E "$restricted_re" || true)"
          if [[ -n "$violations" ]]; then
            echo "[FAIL] Restricted files detected in tracked tree:"
            echo "$violations"
            exit 1
          fi
          echo "[PASS] Publication policy guard."

      - name: Enforce no legacy repo markers
        shell: bash
        run: |
          set -euo pipefail
          legacy_re='m''apfrepe|m''apfre'
          if git grep -n -i -E "$legacy_re" -- .; then
            echo "[FAIL] Legacy repository markers detected."
            exit 1
          fi
          echo "[PASS] Legacy marker guard."

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
