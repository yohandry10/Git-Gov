name: Secret Scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-guard:
    name: Security Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce publication policy (restricted files)
        shell: bash
        run: |
          set -euo pipefail
          restricted_re='^docs/ENTERPRISE_READINESS_DECISION\.md$|^docs/AUDIT_.*\.md$|^docs/INTEGRATIONS_AUDIT_.*\.md$|^skills/|^skills-lock\.json$|^gitgov-video/'
          violations="$(git ls-files | grep -E "$restricted_re" || true)"
          hidden_top_level="$(git ls-files | awk -F/ '{
            top=$1
            if (top ~ /^\./ && top != ".github" && top != ".githooks" && top != ".gitignore") print $0
          }' || true)"
          if [[ -n "$hidden_top_level" ]]; then
            violations="${violations}"$'\n'"${hidden_top_level}"
          fi
          if [[ -n "$violations" ]]; then
            echo "[FAIL] Restricted files detected in tracked tree:"
            echo "$violations" | sed '/^$/d'
            exit 1
          fi
          echo "[PASS] Publication policy guard."

      - name: Enforce no tracked .env files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|[.][^/]+$)' | grep -vE '\.env\.example$' || true)"
          if [[ -n "$tracked_env" ]]; then
            echo "[FAIL] Tracked .env files detected:"
            echo "$tracked_env"
            exit 1
          fi
          echo "[PASS] No tracked .env files."

      - name: Enforce no legacy repo markers
        shell: bash
        run: |
          set -euo pipefail
          legacy_re='m''apfrepe|m''apfre'
          if git grep -n -i -E "$legacy_re" -- .; then
            echo "[FAIL] Legacy repository markers detected."
            exit 1
          fi
          echo "[PASS] Legacy marker guard."

      - name: Enforce neutral naming policy (branch/PR/commits)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          naming_re='co''dex|cl''aude|ai[-_ ]?agent|ai[-_ ]?assistant'

          branch_ref="${HEAD_REF:-${REF_NAME:-}}"
          if [[ -n "$branch_ref" ]] && echo "$branch_ref" | grep -Eiq "$naming_re"; then
            echo "[FAIL] Branch name violates neutral naming policy: $branch_ref"
            exit 1
          fi

          if [[ -n "${PR_TITLE:-}" ]] && echo "$PR_TITLE" | grep -Eiq "$naming_re"; then
            echo "[FAIL] PR title violates neutral naming policy."
            exit 1
          fi

          log_range=""
          if [[ "$EVENT_NAME" == "pull_request" && -n "${PR_BASE_SHA:-}" && -n "${PR_HEAD_SHA:-}" ]]; then
            log_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "$EVENT_NAME" == "push" && -n "${PUSH_AFTER_SHA:-}" ]]; then
            if [[ -n "${PUSH_BEFORE_SHA:-}" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              log_range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
            elif git rev-parse "${PUSH_AFTER_SHA}^" >/dev/null 2>&1; then
              log_range="${PUSH_AFTER_SHA}^..${PUSH_AFTER_SHA}"
            else
              log_range="${PUSH_AFTER_SHA}"
            fi
          else
            log_range="${PUSH_AFTER_SHA:-HEAD}"
          fi

          if git log --format='%s%n%b' "$log_range" | grep -Eiq "$naming_re"; then
            echo "[FAIL] Commit message violates neutral naming policy."
            exit 1
          fi

          echo "[PASS] Neutral naming policy guard."

      - name: Enforce Jira traceability policy (PR/commits)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ticket_re='[A-Z][A-Z0-9]+-[0-9]+'

          log_range=""
          if [[ "$EVENT_NAME" == "pull_request" && -n "${PR_BASE_SHA:-}" && -n "${PR_HEAD_SHA:-}" ]]; then
            log_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "$EVENT_NAME" == "push" && -n "${PUSH_AFTER_SHA:-}" ]]; then
            if [[ -n "${PUSH_BEFORE_SHA:-}" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              log_range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
            elif git rev-parse "${PUSH_AFTER_SHA}^" >/dev/null 2>&1; then
              log_range="${PUSH_AFTER_SHA}^..${PUSH_AFTER_SHA}"
            else
              log_range="${PUSH_AFTER_SHA}"
            fi
          else
            log_range="${PUSH_AFTER_SHA:-HEAD}"
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "${PR_TITLE:-}" || ! "$PR_TITLE" =~ $ticket_re ]]; then
              echo "[FAIL] PR title must include a Jira ticket ID such as KAN-4."
              exit 1
            fi
          fi

          missing=""
          if [[ "$log_range" == *".."* ]]; then
            commit_lines="$(git log --format='%H%x09%s' "$log_range")"
          else
            commit_lines="$(git log -n 1 --format='%H%x09%s' "$log_range")"
          fi

          while IFS=$'\t' read -r sha subject; do
            [[ -z "${sha:-}" ]] && continue
            body="$(git log -1 --format='%b' "$sha")"
            message="${subject}"$'\n'"${body}"
            if ! echo "$message" | grep -Eq "$ticket_re"; then
              missing="${missing}"$'\n'"${sha} ${subject}"
            fi
          done <<< "$commit_lines"

          if [[ -n "$missing" ]]; then
            echo "[FAIL] Commit messages must include a Jira ticket ID such as KAN-4:"
            echo "$missing" | sed '/^$/d'
            exit 1
          fi

          echo "[PASS] Jira traceability policy guard."

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
