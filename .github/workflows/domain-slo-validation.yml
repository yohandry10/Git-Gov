name: Domain SLO Validation

on:
  workflow_dispatch:
    inputs:
      domain_name:
        description: "Optional domain name from ops/slo/domain-slo-targets.json"
        required: false
        default: ""
        type: string
      repo_full_name:
        description: "Optional owner/repo filter for domains without repo override"
        required: false
        default: "yohandry10/Git-Gov"
        type: string
      branch:
        description: "Branch filter for domains without branch override"
        required: false
        default: "main"
        type: string
      hours:
        description: "Lookback window in hours"
        required: false
        default: "168"
        type: string
      correlation_limit:
        description: "Max Jenkins correlations to analyze"
        required: false
        default: "500"
        type: string
      fail_on_breach:
        description: "Fail job if any domain breaches its SLO targets"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "45 12 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Domain SLO Targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate domain SLO target config
        shell: pwsh
        run: |
          ./scripts/control-plane/validate_domain_slo_target_config.ps1 `
            -TargetsPath ops/slo/domain-slo-targets.json `
            -RequireOrgName `
            -RequireRepoFullName `
            -RequireBranch

      - name: Precheck required configuration
        id: precheck
        shell: bash
        env:
          GITGOV_URL: ${{ vars.GITGOV_URL }}
          GITGOV_API_KEY: ${{ secrets.GITGOV_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GITGOV_URL:-}" || -z "${GITGOV_API_KEY:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing_gitgov_url_or_api_key" >> "$GITHUB_OUTPUT"
            echo "Skipping domain SLO validation: missing GITGOV_URL or GITGOV_API_KEY."
          elif [[ ! -f "ops/slo/domain-slo-targets.json" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing_targets_file" >> "$GITHUB_OUTPUT"
            echo "Skipping domain SLO validation: missing ops/slo/domain-slo-targets.json."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=config_present" >> "$GITHUB_OUTPUT"
          fi

      - name: Run domain SLO validation
        id: validation
        if: ${{ steps.precheck.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          GITGOV_URL: ${{ vars.GITGOV_URL }}
          GITGOV_API_KEY: ${{ secrets.GITGOV_API_KEY }}
        run: |
          $hours = "${{ github.event.inputs.hours }}"
          if ([string]::IsNullOrWhiteSpace($hours)) { $hours = "168" }

          $correlationLimit = "${{ github.event.inputs.correlation_limit }}"
          if ([string]::IsNullOrWhiteSpace($correlationLimit)) { $correlationLimit = "500" }

          $domainName = "${{ github.event.inputs.domain_name }}"
          $repoFullName = "${{ github.event.inputs.repo_full_name }}"
          if ([string]::IsNullOrWhiteSpace($repoFullName)) { $repoFullName = "yohandry10/Git-Gov" }

          $branch = "${{ github.event.inputs.branch }}"
          if ([string]::IsNullOrWhiteSpace($branch)) { $branch = "main" }

          $outputDir = "docs/reports/domain-slo-validation-gh-${{ github.run_id }}"

          $params = @{
            GitGovUrl = $env:GITGOV_URL
            ApiKey = $env:GITGOV_API_KEY
            TargetsPath = "ops/slo/domain-slo-targets.json"
            RepoFullName = $repoFullName
            Branch = $branch
            Hours = [int]$hours
            CorrelationLimit = [int]$correlationLimit
            OutputDir = $outputDir
          }

          if (-not [string]::IsNullOrWhiteSpace($domainName)) {
            $params.DomainName = $domainName
          }
          if ("${{ github.event.inputs.fail_on_breach }}" -eq "true") {
            $params.FailOnBreach = $true
          }

          & ./scripts/control-plane/validate_domain_slo_targets.ps1 @params
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "output_dir=$outputDir"

      - name: Upload SLO artifacts
        if: ${{ steps.precheck.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: domain-slo-validation-${{ github.run_id }}
          path: ${{ steps.validation.outputs.output_dir }}
          if-no-files-found: warn
          retention-days: 30

      - name: Skip notice
        if: ${{ steps.precheck.outputs.enabled != 'true' }}
        run: echo "Domain SLO validation skipped (reason=${{ steps.precheck.outputs.reason }})."
