name: Governance Correlation Smoke (Optional)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GITGOV_ENV: ci

jobs:
  correlation-smoke:
    name: Commit-Pipeline Correlation Smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Correlation precheck (GitGov URL + API key)
        id: precheck
        env:
          GITGOV_URL: ${{ vars.GITGOV_URL }}
          GITGOV_API_KEY: ${{ secrets.GITGOV_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GITGOV_URL:-}" ] || [ -z "${GITGOV_API_KEY:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing_gitgov_url_or_api_key" >> "$GITHUB_OUTPUT"
            echo "Skipping correlation smoke: missing GITGOV_URL or GITGOV_API_KEY."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=config_present" >> "$GITHUB_OUTPUT"
          fi

      - name: Correlation skip notice
        if: ${{ steps.precheck.outputs.enabled != 'true' }}
        run: echo "Correlation smoke skipped (reason=${{ steps.precheck.outputs.reason }})."

      - name: Run commit/pipeline correlation smoke
        if: ${{ steps.precheck.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          GITGOV_URL: ${{ vars.GITGOV_URL }}
          GITGOV_API_KEY: ${{ secrets.GITGOV_API_KEY }}
          GITGOV_JENKINS_SECRET: ${{ secrets.GITGOV_JENKINS_SECRET }}
          REPO_FULL_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          pwsh -File scripts/jenkins/validate_commit_pipeline_correlation.ps1 `
            -GitGovUrl "$env:GITGOV_URL" `
            -ApiKey "$env:GITGOV_API_KEY" `
            -JenkinsSecret "$env:GITGOV_JENKINS_SECRET" `
            -RepoFullName "$env:REPO_FULL_NAME" `
            -CommitSha "$env:COMMIT_SHA" `
            -Branch "$env:BRANCH_NAME" `
            -UserLogin "github-actions" `
            -InjectPipelineIfMissing
