name: Enterprise Route Auth Smoke Trend Enforcement

on:
  workflow_dispatch:
    inputs:
      max_reports:
        description: "Maximum auth smoke trend artifacts to include in enforcement"
        required: false
        default: "12"
        type: string
      max_latest_failed_checks:
        description: "Maximum allowed failed checks in the latest parsed report"
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "17 15 * * 5"

permissions:
  actions: read
  contents: read

env:
  GITGOV_ENV: ci

jobs:
  enforce-trend:
    name: Enforce enterprise route auth smoke trend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assert explicit runtime env
        run: bash "$GITHUB_WORKSPACE/.github/scripts/assert-gitgov-env.sh"

      - name: Enforce trend report
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_MAX_REPORTS: ${{ inputs.max_reports }}
          INPUT_MAX_LATEST_FAILED_CHECKS: ${{ inputs.max_latest_failed_checks }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          $maxReports = $env:INPUT_MAX_REPORTS
          if ([string]::IsNullOrWhiteSpace($maxReports)) {
            $maxReports = "12"
          }

          $maxLatestFailedChecks = $env:INPUT_MAX_LATEST_FAILED_CHECKS
          if ([string]::IsNullOrWhiteSpace($maxLatestFailedChecks)) {
            $maxLatestFailedChecks = "0"
          }

          .\scripts\control-plane\generate_enterprise_route_auth_smoke_trend_report.ps1 `
            -Repository $env:GITHUB_REPOSITORY_NAME `
            -WorkflowFile "enterprise-route-auth-smoke.yml" `
            -ArtifactNamePrefix "enterprise-route-auth-smoke-" `
            -MaxReports ([int]$maxReports) `
            -OutputMarkdownPath "out/enterprise-route-auth-smoke-trend-enforcement.md" `
            -OutputJsonPath "out/enterprise-route-auth-smoke-trend-enforcement.json" `
            -Enforce `
            -MaxLatestFailedChecks ([int]$maxLatestFailedChecks) `
            -FailOnFailureIncrease `
            -RequireLatestRunArtifact

      - name: Upload enforcement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-route-auth-smoke-trend-enforcement
          path: |
            out/enterprise-route-auth-smoke-trend-enforcement.md
            out/enterprise-route-auth-smoke-trend-enforcement.json
          if-no-files-found: error
