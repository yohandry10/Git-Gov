name: Public Naming Guard

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  naming-guard:
    name: Block internal-assistant markers in branch/commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build commit range context
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "branch_name=${PR_HEAD_REF}" >> "$GITHUB_OUTPUT"
            echo "commit_range=${PR_BASE_SHA}..${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "branch_name=${REF_NAME}" >> "$GITHUB_OUTPUT"
            before_sha="$BEFORE_SHA"
            after_sha="$AFTER_SHA"
            if [[ -n "$before_sha" && "$before_sha" != "0000000000000000000000000000000000000000" ]]; then
              echo "commit_range=${before_sha}..${after_sha}" >> "$GITHUB_OUTPUT"
            else
              echo "commit_range=${after_sha}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Enforce naming policy
        shell: pwsh
        run: |
          ./scripts/github/check_public_naming_policy.ps1 `
            -BranchName "${{ steps.range.outputs.branch_name }}" `
            -CommitRange "${{ steps.range.outputs.commit_range }}"
