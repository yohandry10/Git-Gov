services:
  gitgov-db:
    image: postgres:16
    container_name: gitgov-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitgov
      POSTGRES_USER: gitgov
      POSTGRES_PASSWORD: gitgov_dev_password
    ports:
      - "5433:5432"
    volumes:
      - gitgov_postgres_data:/var/lib/postgresql/data
      - ./gitgov/gitgov-server/supabase_schema.sql:/workspace/supabase_schema.sql:ro
      - ./gitgov/gitgov-server/supabase:/workspace/supabase_migrations:ro
      - ./docker/postgres-init/01_supabase_schema_local.sh:/docker-entrypoint-initdb.d/01_supabase_schema_local.sh:ro
      - ./docker/postgres-init/02_apply_schema_migrations.sh:/docker-entrypoint-initdb.d/02_apply_schema_migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitgov -d gitgov"]
      interval: 5s
      timeout: 3s
      retries: 20

  gitgov-server:
    build:
      context: ./gitgov
      dockerfile: gitgov-server/Dockerfile
    container_name: gitgov-server
    restart: unless-stopped
    depends_on:
      gitgov-db:
        condition: service_healthy
    environment:
      GITGOV_ENV: dev
      DATABASE_URL: postgresql://gitgov:gitgov_dev_password@gitgov-db:5432/gitgov
      GITGOV_JWT_SECRET: change-me-in-real-env
      GITGOV_SERVER_ADDR: 0.0.0.0:3000
      GITGOV_API_KEY: change-me-dev-api-key
      RUST_LOG: info
      # Optional hardening examples:
      # JENKINS_WEBHOOK_SECRET: your-jenkins-secret
      # JIRA_WEBHOOK_SECRET: your-jira-secret
    ports:
      - "3001:3000"

  jira:
    image: atlassian/jira-software:latest
    container_name: gitgov-jira
    restart: unless-stopped
    profiles: ["jira"]
    environment:
      JVM_MINIMUM_MEMORY: 1024m
      JVM_MAXIMUM_MEMORY: 2048m
    ports:
      - "8095:8080"
    volumes:
      - gitgov_jira_data:/var/atlassian/application-data/jira

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: gitgov-jenkins
    restart: unless-stopped
    profiles: ["jenkins"]
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    ports:
      - "8096:8080"
    volumes:
      - gitgov_jenkins_data:/var/jenkins_home

  sonarqube-db:
    image: postgres:16
    container_name: gitgov-sonarqube-db
    restart: unless-stopped
    profiles: ["sonar"]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_dev_password
      POSTGRES_DB: sonarqube
    volumes:
      - gitgov_sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 5s
      timeout: 3s
      retries: 20

  sonarqube:
    image: sonarqube:community
    container_name: gitgov-sonarqube
    restart: unless-stopped
    profiles: ["sonar"]
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_dev_password
    ports:
      - "9000:9000"
    volumes:
      - gitgov_sonarqube_data:/opt/sonarqube/data
      - gitgov_sonarqube_extensions:/opt/sonarqube/extensions
      - gitgov_sonarqube_logs:/opt/sonarqube/logs

volumes:
  gitgov_postgres_data:
  gitgov_jira_data:
  gitgov_jenkins_data:
  gitgov_sonarqube_db_data:
  gitgov_sonarqube_data:
  gitgov_sonarqube_extensions:
  gitgov_sonarqube_logs:
