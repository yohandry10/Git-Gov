[package]
name = "gitgov-policy-core"
version = "0.1.0"
edition = "2021"
description = "Shared GitGov policy model, parser, discovery, and canonical checksum"
license = "MIT"

[lib]
name = "gitgov_policy_core"
path = "src/lib.rs"

[[bin]]
name = "gitgov-policy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
