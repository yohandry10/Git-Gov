stages:
  - authorize
  - deploy

variables:
  DEPLOY_ENVIRONMENT:
    value: "production"
    description: "Deployment environment"
  RELEASE_ID:
    value: ""
    description: "Release identifier or ticket id"
  EVIDENCE_PACKET_HASH:
    value: ""
    description: "Release-bound GitGov evidence packet SHA-256"
  ENFORCE_GATE:
    value: "true"
    description: "Fail when GitGov returns blocking=true"
  FAIL_ON_WOULD_BLOCK:
    value: "false"
    description: "Also fail on advisory would_block=true"

gitgov_authorize_deployment:
  stage: authorize
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache curl
  script:
    - |
      set -eu
      mkdir -p gitgov-evidence

      if [ -z "${GITGOV_URL:-}" ] || [ -z "${GITGOV_API_KEY:-}" ]; then
        printf '{"status":"skipped","reason":"missing_gitgov_configuration"}\n' > gitgov-evidence/deployment-gate.json
        if [ "${ENFORCE_GATE}" = "true" ]; then
          echo "Missing GitGov configuration for enforced deployment gate." >&2
          exit 1
        fi
        exit 0
      fi

      if [ -z "${EVIDENCE_PACKET_HASH:-}" ]; then
        printf '{"status":"skipped","reason":"missing_release_bound_evidence_packet_hash"}\n' > gitgov-evidence/deployment-gate.json
        if [ "${ENFORCE_GATE}" = "true" ]; then
          echo "Missing release-bound evidence packet hash for enforced deployment gate." >&2
          exit 1
        fi
        exit 0
      fi

      python - <<'PY' > gitgov-deployment-payload.json
      import json
      import os

      payload = {
          "org_name": os.getenv("GITGOV_ORG_NAME") or None,
          "release_id": os.getenv("RELEASE_ID") or os.getenv("CI_COMMIT_TAG") or os.getenv("CI_COMMIT_REF_NAME"),
          "repository_full_name": os.getenv("CI_PROJECT_PATH"),
          "branch": os.getenv("CI_COMMIT_REF_NAME"),
          "target_sha": os.getenv("CI_COMMIT_SHA"),
          "environment": os.getenv("DEPLOY_ENVIRONMENT", "production"),
          "deployer": os.getenv("GITLAB_USER_LOGIN") or "gitlab-ci",
          "ticket_id": os.getenv("RELEASE_ID") or None,
          "evidence_packet_hash": os.getenv("EVIDENCE_PACKET_HASH"),
          "requested_by": "gitlab-ci",
          "deployment_run_id": os.getenv("CI_PIPELINE_ID"),
          "metadata": {
              "provider": "gitlab-ci",
              "project_url": os.getenv("CI_PROJECT_URL"),
              "job_id": os.getenv("CI_JOB_ID"),
              "pipeline_url": os.getenv("CI_PIPELINE_URL"),
          },
      }
      print(json.dumps(payload))
      PY

      curl --fail --silent --show-error \
        -X POST "${GITGOV_URL%/}/deployment-gates/authorize" \
        -H "Authorization: Bearer ${GITGOV_API_KEY}" \
        -H "Accept: application/json" \
        -H "Content-Type: application/json" \
        --data @gitgov-deployment-payload.json \
        --output gitgov-evidence/deployment-gate.json

      python - <<'PY'
      import json
      import os
      import sys

      with open("gitgov-evidence/deployment-gate.json", encoding="utf-8") as handle:
          authorization = json.load(handle)

      print(f"GitGov deployment decision: {authorization.get('decision')}; authorization_id={authorization.get('authorization_id')}")
      if authorization.get("blocking") is True and os.getenv("ENFORCE_GATE") == "true":
          raise SystemExit("GitGov blocked this deployment.")
      if authorization.get("would_block") is True and os.getenv("FAIL_ON_WOULD_BLOCK") == "true":
          raise SystemExit("GitGov reports this deployment would block under stricter enforcement.")
      PY
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gitgov-evidence/deployment-gate.json

deploy_production:
  stage: deploy
  needs:
    - gitgov_authorize_deployment
  script:
    - echo "Deploy here after GitGov authorization."
